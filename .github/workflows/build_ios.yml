name: Build iOS IPA (Free Cloud Mac)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ipad-app/**'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build iOS Archive
        run: |
          cd ipad-app
          xcodebuild clean archive \
            -project DuoScreen.xcodeproj \
            -scheme DuoScreen \
            -configuration Release \
            -archivePath build/DuoScreen.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export Payload / IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DuoScreen.xcarchive/Products/Applications/DuoScreen.app build/Payload/
          cd build
          zip -r DuoScreen.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoScreen-iOS-App
          path: ipad-app/build/DuoScreen.ipa
